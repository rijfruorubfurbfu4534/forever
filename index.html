<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Aanya ❤️</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body {
  height: 100vh;
  margin: 0;
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.card {
  backdrop-filter: blur(18px);
  background: rgba(255,255,255,0.18);
  padding: 45px;
  border-radius: 28px;
  box-shadow: 0 0 60px rgba(0,0,0,0.3);
  position: relative;
  z-index: 5;
  width: 380px;
  transition: opacity 0.6s ease, transform 0.4s ease;
}

h1 {
  margin-bottom: 30px;
  font-size: 23px;
  min-height: 90px;
  color: white;
}

.buttons {
  position: relative;
  width: 100%;
  height: 250px;
}

button {
  padding: 16px 32px;
  font-size: 16px;
  border: none;
  border-radius: 14px;
  position: absolute;
  cursor: pointer;
  transition: all 0.2s ease;
}

.yes {
  background: #ff2e63;
  color: white;
  left: 50%;
  bottom: 15px;
  transform: translateX(-50%) scale(1);
  box-shadow: 0 0 20px rgba(255,46,99,0.7);
}

.no {
  background: #222;
  color: white;
  left: 50%;
  top: 15px;
  transform: translateX(-50%);
}

/* HEARTS */
.heart {
  position: fixed;
  bottom: -20px;
  font-size: 22px;
  animation: floatUp 5s linear forwards;
  opacity: 0.95;
  z-index: 0;
  pointer-events: none;
}

@keyframes floatUp {
  from { transform: translateY(0) rotate(0deg); opacity: 1; }
  to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
}

/* FINAL */
#finalOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  opacity: 0;
  transition: opacity 1.2s ease;
  z-index: 10;
  pointer-events: none;
}

#finalOverlay.show {
  opacity: 1;
  pointer-events: auto;
}

#lovePhoto {
  width: 450px;
  max-width: 90%;
  border-radius: 24px;
  box-shadow: 0 40px 120px rgba(0,0,0,0.7);
}

#finalText {
  margin-top: 30px;
  color: white;
  font-size: 19px;
}
</style>
</head>

<body>

<div class="card" id="card">
  <h1 id="question">Will you be my Valentine? ❤️</h1>

  <div class="buttons">
    <button id="noBtn" class="no">No</button>
    <button id="yesBtn" class="yes">Yes 💖</button>
  </div>
</div>

<div id="finalOverlay">
  <img id="lovePhoto" src="forever.png" alt="Forever">
  <div id="finalText">Hereafter, Aanya Salia, you're my forever.</div>
</div>

<audio id="bgMusic">
  <source src="song.mp3" type="audio/mpeg">
</audio>

<script>
let stage = 1;
let noAttempts = 0;
let yesScale = 1;

const messages = [
  "Are you sureee? 🥺",
  "Think again… carefully 😌",
  "You really want to press No? 😭",
  "That hurts a little you know 💔",
  "AANYA 😳 are you serious?",
  "Okay now you're just testing me 😩",
  "The Yes button is growing stronger 😈",
  "Resistance is futile 💘",
  "The Yes is taking over 😭"
];

const question = document.getElementById("question");
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const card = document.getElementById("card");
const finalOverlay = document.getElementById("finalOverlay");
const bgMusic = document.getElementById("bgMusic");

/* HEARTS */
function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.textContent = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (Math.random() * 30 + 20) + "px";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 5000);
}
setInterval(createHeart, 150);

/* NO ESCAPE + YES DOMINATION */
function moveNo() {

  if (stage > 2) return; // Stop chaos in final confirmation stage

  noAttempts++;

  if (noAttempts <= messages.length) {
    question.textContent = messages[noAttempts - 1];
  }

  const x = Math.random() * (window.innerWidth - 140);
  const y = Math.random() * (window.innerHeight - 80);
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";

  yesScale += 0.5;

  if (yesScale > 6) yesScale = 6; // cap so layout doesn’t break

  yesBtn.style.transform = `translateX(-50%) scale(${yesScale})`;

  let newNoScale = Math.max(0.6, 1 - noAttempts * 0.05);
  noBtn.style.transform = `scale(${newNoScale})`;
}

noBtn.addEventListener("mouseover", moveNo);

/* YES FLOW */
yesBtn.addEventListener("click", () => {

  if (stage === 1) {
    stage = 2;
    question.textContent = "Will you be mine forever? 💍";
  }

  else if (stage === 2) {
    stage = 3;
    question.textContent = "Are you sure? There's no going back 😌";
    yesBtn.textContent = "I'm sure ❤️";
    yesBtn.style.transform = `translateX(-50%) scale(${Math.max(1.3, yesScale)})`;
  }

  else if (stage === 3) {

    bgMusic.volume = 0;
    bgMusic.play().catch(() => {});
    card.style.opacity = "0";

    setTimeout(() => {
      finalOverlay.classList.add("show");

      let fade = setInterval(() => {
        if (bgMusic.volume < 1) {
          bgMusic.volume += 0.05;
        } else {
          clearInterval(fade);
        }
      }, 100);

      confetti({
        particleCount: 500,
        spread: 150,
        origin: { y: 0.6 }
      });

    }, 800);
  }
});
</script>

</body>
</html>
