<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Aanya ❤️</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body {
  height: 100vh;
  margin: 0;
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  transition: background 0.6s ease;
}

/* CARD */
.card {
  backdrop-filter: blur(18px);
  background: rgba(255,255,255,0.18);
  padding: 45px;
  border-radius: 28px;
  box-shadow: 0 0 60px rgba(0,0,0,0.3);
  position: relative;
  z-index: 5;
  width: 370px;
  transition: opacity 0.6s ease, transform 0.4s ease;
}

h1 {
  margin-bottom: 30px;
  font-size: 23px;
  min-height: 80px;
  color: white;
}

/* BUTTONS */
.buttons {
  position: relative;
  width: 100%;
  height: 200px;
}

button {
  padding: 15px 30px;
  font-size: 16px;
  border: none;
  border-radius: 14px;
  position: absolute;
  cursor: pointer;
  transition: all 0.25s ease;
}

/* YES */
.yes {
  background: #ff2e63;
  color: white;
  left: 50%;
  bottom: 15px;
  transform: translateX(-50%) scale(1);
  animation: pulse 1.6s infinite;
}

@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(255,46,99,0.7); }
  70% { box-shadow: 0 0 0 20px rgba(255,46,99,0); }
  100% { box-shadow: 0 0 0 0 rgba(255,46,99,0); }
}

/* STAGE 3 DRAMATIC YES */
.stage3-yes {
  font-size: 22px;
  animation: dramaticPulse 1.1s infinite;
}

@keyframes dramaticPulse {
  0% { transform: translateX(-50%) scale(1.2); box-shadow: 0 0 15px #ff2e63; }
  50% { transform: translateX(-50%) scale(1.5); box-shadow: 0 0 50px #ff2e63; }
  100% { transform: translateX(-50%) scale(1.2); box-shadow: 0 0 15px #ff2e63; }
}

/* NO */
.no {
  background: #222;
  color: white;
  left: 50%;
  top: 15px;
  transform: translateX(-50%) scale(1);
}

/* HEARTS */
.heart {
  position: fixed;
  bottom: -20px;
  font-size: 20px;
  animation: floatUp 5s linear forwards;
  opacity: 0.95;
  z-index: 0;
  pointer-events: none;
}

@keyframes floatUp {
  from { transform: translateY(0) rotate(0deg); opacity: 1; }
  to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
}

/* FINAL OVERLAY */
#finalOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  opacity: 0;
  transition: opacity 1.2s ease;
  z-index: 10;
  pointer-events: none;
}

#finalOverlay.show {
  opacity: 1;
  pointer-events: auto;
}

#lovePhoto {
  width: 420px;
  max-width: 90%;
  border-radius: 24px;
  box-shadow: 0 40px 120px rgba(0,0,0,0.7);
  animation: slowZoom 6s ease forwards;
}

@keyframes slowZoom {
  from { transform: scale(0.95); }
  to { transform: scale(1.05); }
}

#finalText {
  margin-top: 30px;
  color: white;
  font-size: 19px;
  letter-spacing: 0.5px;
}
</style>
</head>

<body>

<div class="card" id="card">
  <h1 id="question">Will you be my Valentine? ❤️</h1>

  <div class="buttons">
    <button id="noBtn" class="no">No</button>
    <button id="yesBtn" class="yes">Yes 💖</button>
  </div>
</div>

<div id="finalOverlay">
  <img id="lovePhoto" src="forever.png" alt="Forever">
  <div id="finalText">Hereafter, Aanya Salia, you're my forever.</div>
</div>

<audio id="bgMusic">
  <source src="song.mp3" type="audio/mpeg">
</audio>

<script>
let stage = 1;
let scaleNo = 1;
let scaleYes = 1;

const question = document.getElementById("question");
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const card = document.getElementById("card");
const finalOverlay = document.getElementById("finalOverlay");
const bgMusic = document.getElementById("bgMusic");

/* HEARTS */
function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.textContent = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (Math.random() * 25 + 18) + "px";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 5000);
}
setInterval(createHeart, 180);

/* MOVE NO */
function moveNo() {
  const x = Math.random() * (window.innerWidth - 120);
  const y = Math.random() * (window.innerHeight - 60);

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";

  if (stage < 3) {
    scaleNo -= 0.015;
    if (scaleNo < 0.3) scaleNo = 0.3;
    noBtn.style.transform = `scale(${scaleNo})`;
  }

  scaleYes += 0.2;
  yesBtn.style.transform = `translateX(-50%) scale(${scaleYes})`;
}
noBtn.addEventListener("mouseover", moveNo);

/* YES FLOW */
yesBtn.addEventListener("click", () => {

  if (stage === 1) {
    stage = 2;
    question.textContent = "Will you be mine forever? 💍";

    noBtn.style.left = "50%";
    noBtn.style.top = "15px";
    noBtn.style.transform = "translateX(-50%) scale(1)";
    yesBtn.style.transform = "translateX(-50%) scale(1)";
  }

  else if (stage === 2) {
    stage = 3;
    question.textContent = "Are you sure? There's no going back 😌";
    yesBtn.textContent = "I'm sure ❤️";
    yesBtn.classList.add("stage3-yes");
  }

  else if (stage === 3) {

    bgMusic.volume = 0;
    bgMusic.play().catch(() => {});

    card.style.transform = "scale(0.95)";
    card.style.opacity = "0";

    setTimeout(() => {
      finalOverlay.classList.add("show");

      let fade = setInterval(() => {
        if (bgMusic.volume < 1) {
          bgMusic.volume += 0.05;
        } else {
          clearInterval(fade);
        }
      }, 100);

      confetti({
        particleCount: 400,
        spread: 140,
        origin: { y: 0.6 }
      });

    }, 800);
  }
});
</script>

</body>
</html>
