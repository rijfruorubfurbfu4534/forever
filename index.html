<script>
let stage = 1;
let noAttempts = 0;
let yesScale = 1;

const stage1Base = "Will you be my Valentine? ❤️";
const stage2Base = "Will you be mine forever? 💍";

const messages = [
  "Are you sureee? 🥺",
  "Think again… carefully 😌",
  "You really want to press No? 😭",
  "That hurts a little you know 💔",
  "AANYA 😳 are you serious?",
  "Okay now you're just testing me 😩",
  "The Yes button is getting stronger 😈",
  "Resistance is futile 💘",
  "The Yes is taking over 😭"
];

const question = document.getElementById("question");
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const card = document.getElementById("card");
const finalOverlay = document.getElementById("finalOverlay");
const bgMusic = document.getElementById("bgMusic");

/* HEARTS */
function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.textContent = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (Math.random() * 30 + 20) + "px";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 5000);
}
setInterval(createHeart, 150);

/* NO ESCAPE + MESSAGE UPDATE */
function moveNo() {

  if (stage === 3) return; // stop chaos in final stage

  noAttempts++;

  // Update escalating message
  if (noAttempts <= messages.length) {
    question.textContent = messages[noAttempts - 1];
  } else {
    question.textContent = "The Yes button is inevitable 😌";
  }

  // Keep No inside card
  const cardRect = card.getBoundingClientRect();
  const btnWidth = noBtn.offsetWidth;
  const btnHeight = noBtn.offsetHeight;

  const maxX = cardRect.width - btnWidth - 20;
  const maxY = cardRect.height - btnHeight - 20;

  const randomX = Math.random() * maxX;
  const randomY = Math.random() * maxY;

  noBtn.style.left = randomX + "px";
  noBtn.style.top = randomY + "px";

  // EXPONENTIAL YES GROWTH
  yesScale = yesScale * 1.4;
  if (yesScale > 8) yesScale = 8;

  yesBtn.style.transform = `translateX(-50%) scale(${yesScale})`;

  // No shrinks slightly but stays visible
  let newNoScale = Math.max(0.7, 1 - noAttempts * 0.05);
  noBtn.style.transform = `scale(${newNoScale})`;
}

noBtn.addEventListener("mouseover", moveNo);

/* YES FLOW */
yesBtn.addEventListener("click", () => {

  if (stage === 1) {
    stage = 2;
    noAttempts = 0;   // reset escalation for stage 2
    yesScale = 1;
    yesBtn.style.transform = "translateX(-50%) scale(1)";
    question.textContent = stage2Base;
  }

  else if (stage === 2) {
    stage = 3;
    question.textContent = "Are you sure? There's no going back 😌";
    yesBtn.textContent = "I'm sure ❤️";
  }

  else if (stage === 3) {

    bgMusic.volume = 0;
    bgMusic.play().catch(() => {});
    card.style.opacity = "0";

    setTimeout(() => {
      finalOverlay.classList.add("show");

      let fade = setInterval(() => {
        if (bgMusic.volume < 1) {
          bgMusic.volume += 0.05;
        } else {
          clearInterval(fade);
        }
      }, 100);

      confetti({
        particleCount: 600,
        spread: 150,
        origin: { y: 0.6 }
      });

    }, 800);
  }
});
</script>
