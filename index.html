<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
  body {
    height: 100vh;
    margin: 0;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .card {
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.15);
    padding: 40px;
    border-radius: 25px;
    box-shadow: 0 0 40px rgba(0,0,0,0.2);
    position: relative;
    z-index: 2;
    width: 350px;
  }

  h1 {
    margin-bottom: 25px;
    font-size: 24px;
    min-height: 70px;
    color: white;
    transition: opacity 0.4s ease;
  }

  .buttons {
    position: relative;
    width: 100%;
    height: 180px;
  }

  button {
    padding: 14px 28px;
    font-size: 16px;
    border: none;
    border-radius: 12px;
    position: absolute;
    transition: all 0.2s ease;
    cursor: pointer;
  }

  .yes {
    background: #ff2e63;
    color: white;
    left: 50%;
    transform: translateX(-50%);
    bottom: 15px;
  }

  .no {
    background: #222;
    color: white;
    left: 50%;
    transform: translateX(-50%);
    top: 15px;
  }

  .hidden { display: none; }

  /* Reveal */

  #photoWrapper {
    margin-top: 20px;
    opacity: 0;
    animation: fadeIn 2s ease forwards;
  }

  .photoContainer {
    position: relative;
    display: inline-block;
  }

  #lovePhoto {
    width: 280px;
    border-radius: 16px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    animation: cinematicZoom 6s ease forwards;
  }

  .caption {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 16px;
    background: rgba(0,0,0,0.45);
    padding: 6px 12px;
    border-radius: 8px;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes cinematicZoom {
    from { transform: scale(1); }
    to { transform: scale(1.05); }
  }

  .romantic-bg {
    position: fixed;
    inset: 0;
    background-size: cover;
    background-position: center;
    filter: blur(28px) brightness(0.55);
    z-index: 0;
  }
</style>
</head>

<body>

<div class="card">
  <h1 id="question">Will you be my Valentine? ❤️</h1>

  <div class="buttons">
    <button id="noBtn" class="no">No</button>
    <button id="yesBtn" class="yes">Yes 💖</button>
  </div>

  <div id="photoWrapper" class="hidden">
    <div class="photoContainer">
      <img id="lovePhoto" src="forever.png">
      <div class="caption">Hereafter, Aanya Salia, you’re my forever.</div>
    </div>
  </div>
</div>

<audio id="bgMusic" preload="auto">
  <source src="https://cdn.pixabay.com/audio/2022/10/30/audio_55c1b5d9a0.mp3" type="audio/mpeg">
</audio>

<script>
let stage = 1;
let scaleNo = 1;
let scaleYes = 1;
const question = document.getElementById("question");
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const photoWrapper = document.getElementById("photoWrapper");
const bgMusic = document.getElementById("bgMusic");

function moveNo() {
  const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
  const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
  noBtn.style.transition = "all 0.15s ease";

  if (stage < 3) {
    scaleNo -= 0.04;
    if (scaleNo < 0.08) scaleNo = 0.08;
    noBtn.style.transform = `scale(${scaleNo})`;
  }

  scaleYes += 0.25;
  yesBtn.style.transform = `translateX(-50%) scale(${scaleYes})`;
}

noBtn.addEventListener("mouseover", moveNo);

yesBtn.addEventListener("click", () => {

  if (stage === 1) {
    stage = 2;
    question.innerHTML = "Will you be mine forever? 💍";
    scaleNo = 1;
    scaleYes = 1;
    noBtn.style.transform = "translateX(-50%) scale(1)";
    yesBtn.style.transform = "translateX(-50%) scale(1)";
  }

  else if (stage === 2) {
    stage = 3;
    question.innerHTML = "Are you sure? There’s no going back 😌";
    yesBtn.innerHTML = "I’m sure. ❤️";
    noBtn.innerHTML = "Wait… maybe not";
    scaleNo = 1;
    scaleYes = 1.2;
  }

  else if (stage === 3) {

    question.style.opacity = "0";
    noBtn.classList.add("hidden");
    yesBtn.classList.add("hidden");

    setTimeout(() => {

      bgMusic.play().catch(() => {});
      question.innerHTML = "";
      question.style.opacity = "1";

      const bg = document.createElement("div");
      bg.className = "romantic-bg";
      bg.style.backgroundImage = "url('forever.png')";
      document.body.appendChild(bg);

      photoWrapper.classList.remove("hidden");

      confetti({
        particleCount: 200,
        spread: 90,
        origin: { y: 0.6 }
      });

    }, 800);
  }
});
</script>

</body>
</html>
